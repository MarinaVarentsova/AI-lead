openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: API specification for AI Квалификатор ИНОБР
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Session management
  - name: conversations
    description: Conversation management
  - name: messages
    description: Message persistence
  - name: diagnostic
    description: Diagnostic answer submission
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session when widget opens
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"

  /conversations:
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation when diagnostic starts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages:
    post:
      operationId: saveMessage
      tags: [messages]
      summary: Save a single chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /diagnostic-answers:
    post:
      operationId: saveDiagnosticAnswers
      tags: [diagnostic]
      summary: Save diagnostic answers as a single flat record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticAnswersInput"
      responses:
        "201":
          description: Answers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticAnswersResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /diagnostic/schema:
    get:
      operationId: getDiagnosticSchema
      tags: [diagnostic]
      summary: Get the canonical v3 diagnostic questions
      responses:
        "200":
          description: Four diagnostic questions in display order
          content:
            application/json:
              schema:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  $ref: "#/components/schemas/DiagnosticSchemaQuestion"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SessionResult:
      type: object
      required: [sessionId, sessionKey]
      properties:
        sessionId:
          type: string
          format: uuid
        sessionKey:
          type: string

    ConversationInput:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid

    ConversationResult:
      type: object
      required: [conversationId, sessionId, currentStep]
      properties:
        conversationId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        currentStep:
          type: string

    MessageInput:
      type: object
      required: [conversationId, role, message]
      properties:
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        message:
          type: string

    MessageResult:
      type: object
      required: [messageId, conversationId]
      properties:
        messageId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid

    DiagnosticAnswersInput:
      type: object
      required: [conversationId, current_area, current_role, education_status, target_tasks]
      properties:
        conversationId:
          type: string
          format: uuid
        current_area:
          type: string
          enum: [construction_repair, design_estimates, construction_control, real_estate_valuation_law, other]
        current_area_other_text:
          type: string
        current_role:
          type: string
          enum: [engineer_designer_estimator, foreman_master_site_specialist, manager_owner, valuer_lawyer_expert, not_in_construction]
        education_status:
          type: string
          enum: [higher, secondary_vocational, currently_studying, no_higher_or_secondary_vocational]
        target_tasks:
          type: string
          enum: [defects_quality, damage_loss, apartment_house_acceptance, judicial_construction_expertise, explore]

    DiagnosticAnswersResult:
      type: object
      required: [saved, conversationId]
      properties:
        saved:
          type: boolean
        conversationId:
          type: string
          format: uuid

    DiagnosticSchemaOption:
      type: object
      required: [code, label, allowsFreeText]
      properties:
        code:
          type: string
        label:
          type: string
        allowsFreeText:
          type: boolean

    DiagnosticSchemaQuestion:
      type: object
      required: [questionNumber, field, questionText, options]
      properties:
        questionNumber:
          type: integer
          minimum: 1
          maximum: 4
        field:
          type: string
          enum: [current_area, current_role, education_status, target_tasks]
        questionText:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticSchemaOption"

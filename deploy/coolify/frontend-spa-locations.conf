# Insert inside the EXISTING server block in Coolify Nginx Configuration.
# Replace its existing location / block; do not append a second one.
# Keep the generated listen, root, index, and other server settings.

# The frontend never proxies API requests or serves the SPA for them.
location = /api {
    return 404;
}
location ^~ /api/ {
    return 404;
}

location / {
    try_files $uri $uri/ /index.html;
}

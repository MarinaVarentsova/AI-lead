<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ICE RUSH — Тимофей</title>
<style>
  html,body{margin:0;height:100%;background:#07111f;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#17304a,#07111f 70%)}
  canvas{background:#dff4ff;max-width:100vw;max-height:100vh;touch-action:none;box-shadow:0 0 40px #000a}
  #ui{position:fixed;inset:0;pointer-events:none}
  .btn{position:absolute;pointer-events:auto;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;border-radius:18px;background:rgba(8,20,35,.62);border:2px solid rgba(255,255,255,.25);color:white;box-shadow:0 8px 18px #0006,inset 0 0 18px #ffffff12;font-weight:bold}
  .btn:active{transform:scale(.96);background:rgba(25,60,95,.78)}
  #leftPad{position:absolute;left:2.5vw;bottom:4vh;width:26vw;height:29vh;pointer-events:auto}
  .d{width:8vw;height:8vw;min-width:58px;min-height:58px;max-width:82px;max-height:82px}
  #up{left:9vw;top:0}.down{left:9vw;bottom:0}#left{left:0;top:9vh}#right{right:0;top:9vh}
  #shoot{right:3vw;bottom:7vh;width:13vw;height:13vw;min-width:92px;min-height:92px;max-width:135px;max-height:135px;border-radius:50%;font-size:18px}
  #dash{right:17vw;bottom:12vh;width:8vw;height:8vw;min-width:62px;min-height:62px;max-width:88px;max-height:88px;border-radius:50%}
  #topbar{position:absolute;left:50%;top:1.6vh;transform:translateX(-50%);pointer-events:none;background:rgba(7,18,30,.78);padding:8px 16px;border-radius:14px;border:1px solid #ffffff2b;text-align:center;min-width:300px}
  #score{font-size:21px;font-weight:800;letter-spacing:.5px}#sub{font-size:12px;opacity:.8;margin-top:3px}
  #overlay{position:absolute;inset:0;background:linear-gradient(#07111fee,#0a1d33ee);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center;padding:30px}
  #overlay h1{font-size:clamp(34px,6vw,76px);margin:0 0 12px;text-shadow:0 7px 30px #000}#overlay p{max-width:740px;font-size:clamp(16px,2.1vw,24px);line-height:1.4;opacity:.92}
  #overlay button{border:0;border-radius:16px;background:#ff5b2d;color:white;padding:15px 28px;font-size:20px;font-weight:800;box-shadow:0 10px 25px #0008;cursor:pointer}
  #hint{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%);font-size:12px;opacity:.65}
  #rotate{display:none;position:fixed;inset:0;background:#07111f;z-index:50;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="ui">
  <div id="topbar"><div id="score">0 : 0</div><div id="sub">Матч 1 / 10</div></div>
  <div id="leftPad"><div id="up" class="btn d">▲</div><div id="left" class="btn d">◀</div><div id="right" class="btn d">▶</div><div id="down" class="btn d down">▼</div></div>
  <div id="dash" class="btn">⚡</div><div id="shoot" class="btn">УДАР</div><div id="hint">стрелки • удар/отбор • ускорение</div>
  <div id="overlay"><h1>ICE RUSH</h1><p>Тимофей Миронов №21 выходит на лёд. 10 коротких матчей, команда ботов средней сложности и специальная игра против команды ChatGPT.</p><button id="startBtn">НАЧАТЬ КУБОК</button></div>
</div>
<div id="rotate">Поверни устройство горизонтально 🏒</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');const W=c.width,H=c.height;const uiScore=document.getElementById('score'),uiSub=document.getElementById('sub');const overlay=document.getElementById('overlay'),shootBtn=document.getElementById('shoot');
let audioCtx=null,musicTimer=null;function beep(freq=440,dur=.08,type='sine',vol=.05){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function startMusic(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const seq=[196,247,294,247,220,277,330,277],lens=.22;let i=0;clearInterval(musicTimer);musicTimer=setInterval(()=>{if(state==='playing')beep(seq[i++%seq.length],.11,'triangle',.015)},lens*1000)}
function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.92;u.pitch=1.02;speechSynthesis.speak(u)}}
const keys={up:false,down:false,left:false,right:false};const matches=[{name:'Север',color:'#1d4ed8',skill:.38},{name:'Молния',color:'#eab308',skill:.41},{name:'Красные Медведи',color:'#dc2626',skill:.44},{name:'Шторм',color:'#0f766e',skill:.46},{name:'Турбо',color:'#7c3aed',skill:.49},{name:'Сталь',color:'#475569',skill:.50},{name:'GPT ICE',color:'#10a37f',skill:.54,gpt:true},{name:'Белые Волки',color:'#64748b',skill:.52},{name:'Полярис',color:'#0891b2',skill:.55},{name:'ICE BOTS',color:'#991b1b',skill:.58,final:true}];
let matchIndex=0,state='menu',timeLeft=120,scoreA=0,scoreB=0,lastT=0,puck,players=[],goalFlash=0,dashEnergy=1;
function resetMatch(){scoreA=scoreB=0;timeLeft=120;dashEnergy=1;puck={x:W/2,y:H/2,vx:0,vy:0,owner:null};players=[];players.push(makeP(340,H/2,'A',true,21));players.push(makeP(280,H/2-150,'A',false,8));players.push(makeP(280,H/2+150,'A',false,17));players.push(makeP(110,H/2,'AG',false,1));players.push(makeP(W-340,H/2,'B',false,matches[matchIndex].gpt?42:10));players.push(makeP(W-280,H/2-150,'B',false,14));players.push(makeP(W-280,H/2+150,'B',false,27));players.push(makeP(W-110,H/2,'BG',false,1))}
function makeP(x,y,team,human,num){return{x,y,vx:0,vy:0,team,human,num,r:24,cool:0,stun:0}}
function arena(){let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0a1929');grd.addColorStop(.16,'#17354c');grd.addColorStop(.17,'#e9f8ff');grd.addColorStop(1,'#cfeeff');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f8fbff';ctx.fillRect(25,85,W-50,H-170);ctx.fillStyle='#c9e7f3';ctx.fillRect(42,102,W-84,H-204);ctx.fillStyle='#eaf9ff';ctx.fillRect(52,112,W-104,H-224);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2,112);ctx.lineTo(W/2,H-112);ctx.stroke();ctx.strokeStyle='#3b82f6';[W*.27,W*.73].forEach(x=>{ctx.beginPath();ctx.moveTo(x,112);ctx.lineTo(x,H-112);ctx.stroke()});ctx.strokeStyle='#ef444477';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H/2,76,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ef4444aa';[[W*.33,H*.32],[W*.33,H*.68],[W*.67,H*.32],[W*.67,H*.68]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],7,0,Math.PI*2);ctx.fill()});drawGoal(62,H/2,'left');drawGoal(W-62,H/2,'right');ctx.fillStyle='#ffffff33';for(let i=0;i<7;i++)ctx.fillRect(120+i*165,150,70,4)}
function drawGoal(x,y,side){ctx.strokeStyle='#e11d48';ctx.lineWidth=7;ctx.strokeRect(side==='left'?x-24:x-28,y-65,52,130);ctx.strokeStyle='#94a3b855';ctx.lineWidth=1;for(let i=-55;i<60;i+=14){ctx.beginPath();ctx.moveTo(side==='left'?x-24:x-28,y+i);ctx.lineTo(side==='left'?x+28:x+24,y+i);ctx.stroke()}}
function drawPlayer(p){const enemy=p.team[0]==='B';const col=enemy?matches[matchIndex].color:'#111827';ctx.fillStyle='#0f172a2a';ctx.beginPath();ctx.ellipse(p.x,p.y+19,30,11,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#64748b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-18,p.y+26);ctx.lineTo(p.x-2,p.y+29);ctx.moveTo(p.x+4,p.y+29);ctx.lineTo(p.x+20,p.y+26);ctx.stroke();ctx.strokeStyle='#111827';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(p.x-8,p.y+5);ctx.lineTo(p.x-14,p.y+23);ctx.moveTo(p.x+8,p.y+5);ctx.lineTo(p.x+14,p.y+23);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(p.x-21,p.y-24,42,35,10);ctx.fill();if(!enemy){ctx.fillStyle='#ff5b2d';ctx.fillRect(p.x-21,p.y-6,42,6)}ctx.fillStyle=enemy?col:'#0b1220';ctx.beginPath();ctx.arc(p.x,p.y-32,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(p.num,p.x,p.y-3);if(matches[matchIndex].gpt&&enemy&&p.num===42){ctx.font='bold 9px Arial';ctx.fillText('GPT',p.x,p.y+9)}ctx.strokeStyle='#7c4a21';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x+18,p.y-2);ctx.lineTo(p.x+31,p.y+28);ctx.lineTo(p.x+45,p.y+28);ctx.stroke();if(p.human){ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,31,0,Math.PI*2);ctx.stroke()}}
function drawPuck(){ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(puck.x,puck.y,10,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(puck.x-2,puck.y-2,4,2,0,0,Math.PI*2);ctx.fill()}
function clampP(p){p.x=Math.max(70,Math.min(W-70,p.x));p.y=Math.max(135,Math.min(H-135,p.y))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearest(team,target){return players.filter(p=>p.team===team).sort((a,b)=>dist(a,target)-dist(b,target))[0]}
function aiMove(p,dt){if(p.team==='AG'||p.team==='BG'){const gx=p.team==='AG'?108:W-108,ty=Math.max(H/2-72,Math.min(H/2+72,puck.y));p.x+=(gx-p.x)*dt*2.2;p.y+=(ty-p.y)*dt*2.8;return}let skill=p.team==='B'?matches[matchIndex].skill:.48,tx,ty;if(puck.owner){if(puck.owner.team[0]===p.team[0]){if(puck.owner===p){tx=p.team==='A'?W-130:130;ty=H/2+(Math.sin(performance.now()/650+p.num)*110)}else{tx=puck.owner.x+(p.team==='A'?-90:90);ty=puck.owner.y+(p.num%2?110:-110)}}else{tx=puck.owner.x;ty=puck.owner.y}}else{tx=puck.x;ty=puck.y}const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,sp=130+skill*120;p.vx+=(dx/d*sp-p.vx)*dt*(2.5+skill*2);p.vy+=(dy/d*sp-p.vy)*dt*(2.5+skill*2);p.x+=p.vx*dt;p.y+=p.vy*dt;clampP(p);if(!puck.owner&&dist(p,puck)<34){puck.owner=p;beep(180,.03,'square',.02)}if(puck.owner&&puck.owner.team[0]!==p.team[0]&&dist(p,puck.owner)<35&&Math.random()<skill*dt*1.9){puck.owner=p;beep(140,.04,'square',.03)}if(puck.owner===p){const goalX=p.team==='A'?W-75:75,dgoal=Math.abs(goalX-p.x);if(dgoal<370&&Math.random()<skill*dt*.75){let dir=p.team==='A'?1:-1;puck.owner=null;puck.x=p.x+dir*38;puck.y=p.y+12;puck.vx=dir*(460+skill*240);puck.vy=(H/2-p.y)*.5+(Math.random()-.5)*110;beep(240,.05,'square',.03)}}}
function humanMove(p,dt){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),d=Math.hypot(dx,dy)||1,dash=window.dashing&&dashEnergy>0,sp=dash?335:220;if(dash)dashEnergy=Math.max(0,dashEnergy-dt*.42);else dashEnergy=Math.min(1,dashEnergy+dt*.12);p.vx=dx/d*sp;p.vy=dy/d*sp;if(!dx&&!dy){p.vx*=.82;p.vy*=.82}p.x+=p.vx*dt;p.y+=p.vy*dt;clampP(p);if(!puck.owner&&dist(p,puck)<36)puck.owner=p}
function shoot(){if(state!=='playing')return;const p=players[0];if(puck.owner===p){puck.owner=null;puck.x=p.x+40;puck.y=p.y+10;puck.vx=600;puck.vy=(H/2-p.y)*.45;beep(290,.07,'square',.04)}else{let e=nearest('B',p);if(e&&dist(e,p)<58&&puck.owner===e){puck.owner=p;beep(150,.05,'square',.04)}}}
function physics(dt){const human=players[0];humanMove(human,dt);players.slice(1).forEach(p=>aiMove(p,dt));if(puck.owner){const p=puck.owner;puck.x=p.x+(p.team[0]==='A'?32:-32);puck.y=p.y+12}else{puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;puck.vx*=Math.pow(.986,dt*60);puck.vy*=Math.pow(.986,dt*60);if(puck.y<125||puck.y>H-125){puck.vy*=-.85;puck.y=Math.max(125,Math.min(H-125,puck.y))}}['AG','BG'].forEach(t=>{let g=players.find(p=>p.team===t);if(!puck.owner&&dist(g,puck)<36){puck.vx*=-.85;puck.vy+=(Math.random()-.5)*140;beep(110,.04,'square',.03)}});if(puck.x<62&&Math.abs(puck.y-H/2)<60)goal('B');if(puck.x>W-62&&Math.abs(puck.y-H/2)<60)goal('A')}
function goal(team){if(team==='A')scoreA++;else scoreB++;goalFlash=1;beep(team==='A'?660:120,.2,'sawtooth',.05);uiScore.textContent=scoreA+' : '+scoreB;puck={x:W/2,y:H/2,vx:0,vy:0,owner:null};players.forEach((p,i)=>{if(i<4){p.x=[340,280,280,110][i];p.y=[H/2,H/2-150,H/2+150,H/2][i]}else{let j=i-4;p.x=[W-340,W-280,W-280,W-110][j];p.y=[H/2,H/2-150,H/2+150,H/2][j]}})}
function render(){arena();if(goalFlash>0){ctx.fillStyle=`rgba(255,255,255,${goalFlash*.45})`;ctx.fillRect(0,0,W,H);goalFlash*=.90}players.slice().sort((a,b)=>a.y-b.y).forEach(drawPlayer);drawPuck();ctx.fillStyle='#0b1220aa';ctx.fillRect(W-270,H-45,210,14);ctx.fillStyle='#f8fafc';ctx.fillRect(W-267,H-42,204*dashEnergy,8)}
function loop(t){let dt=Math.min(.033,(t-lastT)/1000||.016);lastT=t;if(state==='playing'){timeLeft-=dt;if(timeLeft<=0){endMatch();timeLeft=0}physics(dt);uiSub.textContent=`Матч ${matchIndex+1} / 10 • ${matches[matchIndex].name} • ${Math.ceil(timeLeft)} сек`;shootBtn.textContent=puck.owner===players[0]?'УДАР':'ОТБОР'}render();requestAnimationFrame(loop)}
function showOverlay(title,body,button,cb){overlay.style.display='flex';overlay.innerHTML=`<h1>${title}</h1><p>${body}</p><button id="ovbtn">${button}</button>`;document.getElementById('ovbtn').onclick=cb}
function startMatch(){resetMatch();state='playing';overlay.style.display='none';uiScore.textContent='0 : 0';uiSub.textContent=`Матч ${matchIndex+1} / 10 • ${matches[matchIndex].name}`;if(matches[matchIndex].gpt)say('Тимофей, теперь матч против моей команды. Посмотрим, кто кого.')}
function endMatch(){state='between';const win=scoreA>scoreB,draw=scoreA===scoreB;let title=win?'ПОБЕДА':draw?'НИЧЬЯ':'РЕВАНШ?',extra=matches[matchIndex].gpt?' Это был матч против команды ChatGPT.':'';if(matchIndex===9&&win){state='done';setTimeout(()=>say('Тимофей, это победа.'),450);showOverlay('КУБОК ТВОЙ!','Тимофей, это победа. Финальный счёт: '+scoreA+' : '+scoreB+'.','СЫГРАТЬ ЕЩЁ РАЗ',()=>{matchIndex=0;startMatch()});return}if(win||draw){showOverlay(title,`Счёт ${scoreA} : ${scoreB}.${extra}`,matchIndex<9?'СЛЕДУЮЩИЙ МАТЧ':'ПОВТОРИТЬ',()=>{if(matchIndex<9)matchIndex++;startMatch()})}else showOverlay(title,`Счёт ${scoreA} : ${scoreB}.${extra}`,'ПЕРЕИГРАТЬ',startMatch)}
function bindHold(id,key){const el=document.getElementById(id);['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true}));['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}))}
bindHold('up','up');bindHold('down','down');bindHold('left','left');bindHold('right','right');document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();window.dashing=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('dash').addEventListener(ev,e=>{window.dashing=false}));window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' ')shoot();if(e.key==='Shift')window.dashing=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='Shift')window.dashing=false});document.getElementById('startBtn').onclick=()=>{startMusic();startMatch()};resetMatch();requestAnimationFrame(loop);
</script>
</body>
</html>
